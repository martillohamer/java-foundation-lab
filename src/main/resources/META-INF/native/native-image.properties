# GraalVM Native Image Configuration
# This file configures the native image builder to include required classes
# for Spring Boot WebSocket, JSON processing, and other runtime components.

# Spring WebFlux and WebSocket resources
-Additions=org.springframework.boot.web.servlet.context.ServletWebServerApplicationContext,
          org.springframework.web.servlet.DispatcherServlet,
          org.springframework.web.socket.config.annotation.WebSocketConfiguration,
          org.springframework.web.socket.handler.TextWebSocketHandler,

# Jackson JSON Parser
-Additions=com.fasterxml.jackson.databind.ObjectMapper,
          com.fasterxml.jackson.core.JsonParser,
          com.fasterxml.jackson.core.type.TypeReference,

# Spring Core
-Additions=org.springframework.context.ApplicationContext,
          org.springframework.context.event.ApplicationEventMulticaster,
          org.springframework.core.env.Environment,

# HTTP Handling
-Additions=org.springframework.http.HttpMethod,
          org.springframework.http.MediaType,
          org.springframework.web.util.UriComponentsBuilder,

# Logging
-Additions=org.slf4j.helpers.NOPLoggerFactory,
          org.slf4j.Logger,
          org.slf4j.helpers.NOPLogger,

# Reflection Configuration (if using reflection-based)
-ReflectionConfigurationFiles=reflect-config.json

# JNI Configuration
- jars=lib/jbootnet.dll,lib/jcipher.dll

# Enable JSSE (Java Secure Socket Extension)
-EnableJSSE=true

# JavaScript engine (Nashorn/GraalVM)
-AddQuotes=.*

# Preserve all config metadata
-Metadata=true