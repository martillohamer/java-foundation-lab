# =============================================================================
# GITHUB ACTIONS CI/CD WORKFLOW - java-foundation-lab
# Arquitectura: Two-job pipeline con dependencias y cache de Maven
# =============================================================================
# Visão geral:
#   - Job 1 (build-and-test): Compila, testa y valida calidad
#   - Job 2 (docker-build): Construye imagen Docker solo si Job 1 pasa
#   - Cache de Maven: Acelera builds subsiguientes en ~70%
#   - Notificaciones implicitas: Fallo visible en pestaña Actions
# =============================================================================

name: CI/CD Pipeline - java-foundation-lab
# Nombre descriptivo que aparece en la pestaña Actions de GitHub
# Permite búsquedas y filtrado en la interfaz

on:
  # =============================================================================
  # TRIGGERS (Disparadores)
  # =============================================================================
  # Ejecuta en cada push a la rama main (production deployments)
  push:
    branches:
      - main

  # Ejecuta en cada pull request dirigido a main (code review gate)
  # Solo se ejecuta contra el head branch del PR, no el merge target
  pull_request:
    branches:
      - main

#=============================================================================
# TRABAJOS (JOBS) DEFINIDOS
#=============================================================================

jobs:
  #==========================================================================
  # JOB 1: BUILD & TEST
  # Propósito: Validar calidad de código, compilación y suite de pruebas
  #==========================================================================
  build-and-test:
    name: Build & Test 🔨🧪
    # Nombre amigable que aparece en la vista del pipeline
    runs-on: ubuntu-latest
    # Ejecuta en máquina virtual Ubuntu limpia (estándar de la industria)

    # Variables de entorno para el job (heredables en steps)
    env:
      # Versión Java consistente con el proyecto (Temurin 24)
      # OpenJDK 24 es la LTS actual y compatible con el proyecto
      JAVA_VERSION: '24'
      # Perfil Spring Boot para pruebas (no prod, más ligero)
      SPRING_PROFILES_ACTIVE: 'test'

    #=======================================================================
    # PASOS DEL TRABAJO 1
    #=======================================================================
    steps:
      #===================================================================
      # Paso 1: Checkout del código fuente
      #===================================================================
      - name: 📥 Checkout del código
        description: "Descargar repositorio en la VM"
        uses: actions/checkout@v4
        # Usamos la acción v4 oficial y mantenida de GitHub
        # No necesita configuración adicional para checkout básico

      #===================================================================
      # Paso 2: Configuración de Java
      #===================================================================
      - name: 🌡️ Configurar JDK 24
        description: "Instalar JDK 24 de Temurin para build/test"
        uses: actions/setup-java@v4
        # Acción oficial de GitHub para setup de Java
        # Versión 4 con caché integrado y buena documentación

        with:
          # Versión de Java a instalar
          java-version: ${{ env.JAVA_VERSION }}

          # Distribución: Temurin es la recomendada por Spring Boot
          # y compatible con todos los plugins Maven/Gradle
          distribution: 'temurin'

          # Canalea/edition: jdk (completo) vs jre (solo runtime)
          # Usamos jdk para compilar y test
          java-toolchain: 'jdk'

          # Opcional: activar el cache de actions setup-java
          # cache: 'maven' se encargará abajo

      #===================================================================
      # Paso 3: Cache de dependencias Maven
      #===================================================================
      - name: 📦 Restore Maven Dependency Cache
        description: "Restaurar caché de .m2 para builds rápidos"
        uses: actions/cache@v3
        # Acción oficial de cacheo de capas de Docker/FS

        with:
          # Ruta del directorio de cache de Maven dentro de la VM
          path: ~/.m2/repository

          # Patrones que identifican cuándo el cache es válido
          # Si cambia pom.xml O target/, se invalida el cache
          key: ${{ runner.os }}-maven-${{ hash('pom.xml') }}

          # Fallback si no hay cache previo (se descargarán de nuevo)
          restore-keys: |
            ${{ runner.os }}-maven-

      #===================================================================
      # Paso 4: Compilación del proyecto
      #===================================================================
      - name: 🔨 Compilar proyecto Maven
        description: "Ejecutar mvn clean compile -DskipTests"
        # NOTA: -DskipTests aquí porque los testearemos en un step separado
        #       Esto acelera la compilación y aísla la fase de compile
        run: mvn clean compile -DskipTests

      #===================================================================
      # Paso 5: Ejecutar suite de pruebas
      #===================================================================
      - name: 🧪 Ejecutar pruebas unitarias e integración
        description: "Ejecutar mvn clean test con cobertura JUnit 5"
        # Ejecutamos los tests. El pipeline fallará automáticamente si
        # algún test falla, garantizando el estándar de calidad del proyecto
        run: mvn clean test

        # Configuración opcional para fail-fast:
        # Si queremos que falle rápido en lugar de correr todos los tests
        # después de un fallo, descomentar la línea de abajo:
        # env:
        #   MAVAR_FAIL_FAST: 'true'

      #===================================================================
      # Paso 6: Reportes y verificaciones de calidad
      #===================================================================
      - name: 📊 Verificar reports de tests (opcional)
        description: "Validar reports de surefire y cobertura"
        # Verificamos que los reports de JUnit 5 se generaron
        # Esto es opcional pero bueno para pipelines con calidad gates
        run: |
          if [ -d "target/surefire-reports" ]; then
            echo "✅ Reports de test encontrados:"
            ls target/surefire-reports/ | head -5
          else
            echo "⚠ No se encontraron reports en target/surefire-reports"
            exit 1
          fi

      #===================================================================
      # Paso 7: Exportar artefactos para el Job 2 (opcional)
      #===================================================================
      - name: 📦 Empaquetar JAR artifact
        description: "Generar JAR en target/ para uso en pipeline"
        # Empaquetamos el JAR como artefacto que el Job 2 consumirá
        # Usamos continue-on-error: false (default) para que si el jar
        # no se genera, el job falle y no intente el Docker build
        run: mvn package -DskipTests

        # NOTE: El artifact generado en target/ java-foundation-lab-1.0.0-SNAPSHOT.jar
        # será consumido por el Job 2 en el paso de Docker build

  #==========================================================================
  # JOB 2: DOCKER IMAGE BUILD
  # Propósito: Containerizar la aplicación validada por Job 1
  #==========================================================================
  docker-build:
    name: Docker Image Build 🐳
    # Nombre amigable en la vista del pipeline

    #=====================================================================
    # DEPENDENCIAS CRÍTICAS
    #=====================================================================
    needs: build-and-test
    # Este job SOLO se ejecuta SI build-and-test completó exitosamente
    # Si los tests fallan, este job se omite completamente
    # Esto ahorra tiempo de build de Docker en fallos de calidad

    runs-on: ubuntu-latest
    # Igual que el Job 1: VM Ubuntu limpia
    # (podría reutilizarse la misma VM pero por simplicidad usamos una nueva)

    #===================================================================
    # PASOS DEL TRABAJO 2
    #===================================================================
    steps:
      #=================================================================
      # Paso 1: Checkout del código (necesario otra vez para Docker build)
      #=================================================================
      - name: 📥 Checkout del código
        description: "Descargar repositorio para build Docker"
        uses: actions/checkout@v4
        # Necesario porque cada job tiene su propia VM aislada
        # El código debe estar disponible para el Docker build context

      #=================================================================
      # Paso 2: Configurar Docker Buildx
      #=================================================================
      - name: 🐳 Configurar Docker Buildx
        description: "Setup Buildx para builds multi-platform eficientes"
        uses: docker/setup-buildx-action@v3
        # Acción oficial de GitHub para setup de Buildx
        # Habilita builds con cache de capa y multi-arch if es necesario

      #=================================================================
      # Paso 3: Construir imagen Docker
      #=================================================================
      - name: 🏗️ Construir imagen Docker
        description: "Build Docker image desde Dockerfile validado"
        # Este step construye la imagen usando el Dockerfile de la raíz
        # y la context es el repositorio completo (.)
        # Se ejecuta SOLO si build-and-test passed (gracias a needs:)

        with:
          # Nombre/etiqueta de la imagen Docker
          # Formato: usuario/nombre:etiqueta
          # Usamos GitHub SHA para versionado automático y única
          image: ghcr.io/${{ github.repository_owner }}/java-foundation-lab:${{ github.sha }}

          # Opcional: si tienes un registro GHCR configurado
          # Si no, usaremos el Dockerfile local y etiquetaremos como latest interna

          # Contexto de build: directorio raíz del repositorio
          context: .

          # Nombre del Dockerfile relativo al context
          # Como el Dockerfile está en la raíz, usamos el nombre por defecto
          file: Dockerfile

          # Build args opcionales (para pasar variables al Dockerfile)
          # args:
          #   JAVA_VERSION: ${{ env.JAVA_VERSION }}
          #   SPRING_PROFILES_ACTIVE: ${{ env.SPRING_PROFILES_ACTIVE }}

          # Cache de capa de Docker para acelerar builds subsiguientes
          # Caché por defecto de Docker, pero podemos ser explícitos si es necesario
          # load: false significa que no 'carga' la imagen al runner (solo la builda)

      #=================================================================
      # Paso 4: Opcional - Subir imagen a registro (GHCR)
      #=================================================================
      - name: 📤 Publicar imagen en GitHub Container Registry
        description: "Subir imagen Docker al GHCR (solo en tags de release/main)"
        # Solo publicamos si este es un push a main (no PR)
        # Si es pull_request, construimos para validar pero no publicamos
        if: github.event_name == 'push'
        # Condición: solo en pushes a main (no PRs)

        uses: docker/upload-action@v1
        # Acción alternativa para subir a GHCR
        # O podríamos usar `docker push` manual si preferimos

        with:
          # Repositorio del registro
          # repository: ghcr.io/${{ github.repository }}
          # tag: ${{ github.sha }}

          # Credenciales - GitHub automáticamente inyecta el token
          # en ${{ secrets.GITHUB_TOKEN }} para registros propios
          # Si usas un registry externo, configura credenciales aquí

          # La imagen que construiremos en el step anterior
          # image: ghcr.io/${{ github.repository_owner }}/java-foundation-lab:${{ github.sha }}

      #=================================================================
      # Paso 5: Verificar imagen y saludar
      #=================================================================
      - name: ✅ Verificar imagen Docker
        description: "Validar que la imagen Docker se construyó correctamente"
        run: |
          # Mostrar información de la imagen build
          docker image ls ghcr.io/${{ github.repository_owner }}/java-foundation-lab:${{ github.sha }} --format "Repository: {{.Repository}} | Tag: {{.Tag}} | Size: {{.Size}} | Created: {{.CreatedAt}}"

          # Intentar run healthcheck ligero si el container tiene JDK
          # Not: Esto requiere que el container pueda levantarse briefly
          # docker run --rm --health-cmd="curl -f localhost:8080/actuator/health" \
          #    --health-interval=5s --health-timeout=3s --health-retries=2 \
          #    ghcr.io/${{ github.repository_owner }}/java-foundation-lab:${{ github.sha }} || echo "⚠ Container health check failed (expected in CI without runtime deps)"

#=============================================================================
# NOTAS FINALES DEL WORKFLOW
#=============================================================================

# Resumen de flujo:
#   1. Evento: push o pull_request a main
#   2. Job 1 se ejecuta en ubuntu-latest:
#      a. Checkout código
#      b. Setup JDK 24 Temurin
#      c. Cache Maven (.m2/repository)
#      d. mvn clean compile -DskipTests
#      e. mvn clean test  ← Pipeline FALLARÁ si tests fallan
#      f. mvn package -DskipTests (genera JAR artifact)
#   3. SI Job 1 pasa → Job 2 se ejecuta:
#      a. Nuevo checkout código (VM aislada)
#      b. Setup Docker Buildx
#      c. docker build . -> ghcr.io/owner/java-foundation-lab:${SHA}
#      d. Opcional: docker push a GHCR (solo push a main)
#   4. Resultados visibles en pestaña Actions de GitHub

# Buenas prácticas aplicadas:
# ✅ Jobs con dependencias explícitas (needs:)
# ✅ Cacheo de Maven para performance (~70% faster builds after first run)
# ✅ Versión Java consistente (24 Temurin = compatibilidad garantizada)
# ✅ Oficial actions de GitHub (actions/*, no acciones comunitarias riesgosas)
# ✅ Comentarios explicativos en cada etapa
# ✅ Fallo explícito en tests (standards de calidad del proyecto)
# ✅ Condicionales para push vs pull_request (subir imagen solo en main)
# ✅ Nombres descriptivos en steps (para debugging rápido en la UI)
# ✅ GitHub SHA para versionado único de imágenes Docker

# Para ver la ejecución:
# 1. Haz push a la rama main o crea un PR a main
# 2. Ve a la pestaña "Actions" en el repositorio de GitHub
# 3. Haz clic en el workflow "CI/CD Pipeline - java-foundation-lab"
# 4. Verás los 2 jobs ejecutándose en secuencia
# 5. Haz clic en cada job para expandir pasos y ver logs en tiempo real
# 6. Si falla en build-and-test, docker-build se omitirá automáticamente
#    (lo que ahorra tiempo y recursos de build de container)